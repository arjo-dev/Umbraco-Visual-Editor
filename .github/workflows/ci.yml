name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs all of CI before it packs (release.yml).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CLIENT_DIR: src/UmbracoVisualEditor/Client
  E2E_DIR: tests/e2e
  SITE_DIR: Umbraco Visual Editor.Test Site
  SITE_URL: https://localhost:5001

jobs:
  build:
    name: Build, lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ${{ env.CLIENT_DIR }}/package-lock.json
            ${{ env.E2E_DIR }}/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # ---- Client ----
      - name: Install client dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci --no-audit --no-fund

      - name: Lint
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run lint

      - name: Check formatting
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run format:check

      - name: Type-check and build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run build

      - name: Install Chromium for client unit tests
        working-directory: ${{ env.CLIENT_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Client unit tests
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm test

      # ---- .NET ----
      # The client is already built above, so skip the csproj's npm build.
      - name: Build solution
        run: dotnet build "Umbraco Visual Editor.slnx" -c Release -p:SkipClientBuild=true

      - name: Test
        run: dotnet test --solution "Umbraco Visual Editor.slnx" -c Release --no-build

      # ---- Smoke test: fresh install of the Test Site ----
      # The backoffice token endpoint (OpenIddict) only accepts HTTPS, so serve the site with a dev certificate.
      - name: Create HTTPS dev certificate
        run: dotnet dev-certs https

      - name: Start Test Site (fresh install)
        working-directory: ${{ env.SITE_DIR }}
        run: |
          # Throwaway credentials for this run only; masked in logs.
          ADMIN_PASSWORD="$(openssl rand -base64 24)"
          CLIENT_SECRET="$(openssl rand -base64 24)"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$CLIENT_SECRET"
          echo "CLIENT_SECRET=$CLIENT_SECRET" >> "$GITHUB_ENV"
          # The E2E tests sign in to the backoffice as the admin user.
          echo "ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"
          # Hosting:Debug=false like production: Umbraco only uses its partial-view cache when not debugging,
          # and the render-session leak check below needs that cache active.
          ASPNETCORE_ENVIRONMENT=Development \
          ASPNETCORE_URLS="$SITE_URL" \
          Umbraco__CMS__Hosting__Debug=false \
          Umbraco__CMS__Unattended__UnattendedUserPassword="$ADMIN_PASSWORD" \
          TestSite__ApiUser__ClientSecret="$CLIENT_SECRET" \
            nohup dotnet run -c Release --no-build --no-launch-profile > "$RUNNER_TEMP/site.log" 2>&1 &
          # Poll the API, never a page: no page may be rendered (and cached) before the leak check.
          # With Hosting:Debug=false, Umbraco runs package migrations (Clean, uSync first boot) in the background after
          # reporting "Run", so wait until the dev API user exists and the uSync-imported Playground document is there.
          api="$SITE_URL/umbraco/management/api/v1"
          for i in $(seq 1 120); do
            token="$(curl -sfk -X POST "$api/security/back-office/token" \
              -d grant_type=client_credentials -d client_id=umbraco-back-office-mcp \
              --data-urlencode "client_secret=$CLIENT_SECRET" 2>/dev/null | jq -r '.access_token // empty' 2>/dev/null || true)"
            if [ -n "$token" ] && curl -sfk -o /dev/null -H "Authorization: Bearer $token" \
                "$api/document/5e1d6a3b-7c42-4f0e-9a51-0b3c2d4e5f67"; then
              echo "Site ready after ~$((i * 2))s"; exit 0
            fi
            sleep 2
          done
          echo "::error::Test Site did not start"; tail -n 100 "$RUNNER_TEMP/site.log"; exit 1

      # Runs before any live page is requested: a render session on a cold cache must not leak its markers or
      # unsaved values into what live visitors get (published model cache, cached partials).
      - name: Render session does not leak into live pages
        run: |
          set -euo pipefail
          api="$SITE_URL/umbraco/management/api/v1"
          token="$(curl -sfk -X POST "$api/security/back-office/token" \
            -d grant_type=client_credentials -d client_id=umbraco-back-office-mcp \
            --data-urlencode "client_secret=$CLIENT_SECRET" | jq -r .access_token)"
          doc=5e1d6a3b-7c42-4f0e-9a51-0b3c2d4e5f67 # Visual Editor Playground
          body="$(curl -sfk -H "Authorization: Bearer $token" "$api/document/$doc" | jq --arg doc "$doc" '{
            documentKey: $doc, culture: "en-US", segment: null,
            values: [.values[] | if .alias == "title" and .culture == "en-US" then .value = "LEAKCHECK" else . end]
          }')"
          # Creating the session sets the viewer cookie render pages need (#34); keep it, as a browser would.
          jar="$(mktemp)"
          url="$(curl -sfk -c "$jar" -X POST -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d "$body" "$SITE_URL/umbraco/arjovisualeditor/api/v1/render-session" | jq -r .url)"
          status="$(curl -sk -o /dev/null -w '%{http_code}' "$SITE_URL$url")"
          [ "$status" = 404 ] || { echo "::error::Render session URL without the viewer cookie returned $status, not 404"; exit 1; }
          echo "✓ render session URL alone is refused"
          session="$(curl -sfk -b "$jar" "$SITE_URL$url")"
          grep -q 'LEAKCHECK' <<< "$session" || { echo "::error::Render session did not show the unsaved title"; exit 1; }
          grep -q 'uve:b:' <<< "$session" || { echo "::error::Render session has no block markers"; exit 1; }
          # Rich text is marked with comments, text with invisible characters; both come from the model factory decorator.
          grep -q 'uve:p:' <<< "$session" || { echo "::error::Render session has no property markers"; exit 1; }
          echo "✓ render session shows unsaved values with markers"
          for path in /playground/ / /about/; do
            live="$(curl -sfk "$SITE_URL$path")"
            if grep -qE 'LEAKCHECK|uve:[pb]:|&#x2063;|uve-markers' <<< "$live"; then
              echo "::error::$path contains edit-mode markers or unsaved values from a render session"; exit 1
            fi
            echo "✓ $path is clean"
          done

      - name: Smoke test pages and Management API
        run: |
          set -euo pipefail
          check_page() {
            local html
            html="$(curl -sfk "$SITE_URL$1")" || { echo "::error::$1 did not return 200"; exit 1; }
            grep -q "$2" <<< "$html" || { echo "::error::$1 is missing '$2'"; exit 1; }
            echo "✓ $1 contains '$2'"
          }
          check_page / '<h1>'
          check_page /playground/ 'Visual Editor Playground'
          check_page /playground/ 'data-area-alias="right"'
          check_page /da/legeplads/ 'Visual Editor Legeplads'

          token="$(curl -sfk -X POST "$SITE_URL/umbraco/management/api/v1/security/back-office/token" \
            -d grant_type=client_credentials -d client_id=umbraco-back-office-mcp \
            --data-urlencode "client_secret=$CLIENT_SECRET" | jq -r .access_token)"
          [ -n "$token" ] && [ "$token" != null ] || { echo "::error::Dev API user could not get a token"; exit 1; }
          echo "✓ dev API user authenticated"

          curl -sfk -H "Authorization: Bearer $token" "$SITE_URL/umbraco/management/api/v1/manifest/manifest/private" \
            | jq -e '.[] | select(.name == "UmbracoVisualEditor")' > /dev/null \
            || { echo "::error::UmbracoVisualEditor manifest not registered"; exit 1; }
          echo "✓ UmbracoVisualEditor manifest registered"

      - name: Working tree unchanged by first boot
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::First boot modified tracked files (uSync export-on-save?)"
            exit 1
          fi

      # ---- E2E: the Visual editor in a real backoffice (#37), against the site above ----
      - name: Install E2E dependencies
        working-directory: ${{ env.E2E_DIR }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E tests
        working-directory: ${{ env.E2E_DIR }}
        env:
          URL: ${{ env.SITE_URL }}
          UMBRACO_USER_LOGIN: admin@example.com
          UMBRACO_USER_PASSWORD: ${{ env.ADMIN_PASSWORD }}
        run: |
          npm run typecheck
          npm test

      # A second site with other conventions (#38): plain Umbraco, compiled models, hand-rolled block loops, a view
      # component, a cached partial and output caching. The tests start a throwaway copy of it themselves.
      - name: E2E tests (Compat Site)
        working-directory: ${{ env.E2E_DIR }}
        env:
          # The client is built above; don't build it again for the Compat Site's `dotnet run`.
          SkipClientBuild: 'true'
        run: npm run test:compat

      - name: Working tree unchanged by E2E
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::The E2E tests modified tracked files (uSync export-on-save?)"
            exit 1
          fi

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            ${{ env.E2E_DIR }}/playwright-report
            ${{ env.E2E_DIR }}/test-results
          if-no-files-found: ignore

      - name: Upload site log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-site-log
          path: ${{ runner.temp }}/site.log
          if-no-files-found: ignore

  # Umbraco 17 (#38): the package builds for either major (UMBRACO_17 in the code; see docs/compatibility.md). The Test
  # Site is 18-only (Clean, uSync), so on 17 the Compat Site is what's run end to end.
  umbraco-17:
    name: Umbraco 17
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in step with UMBRACO_17_VERSION in release.yml.
      UmbracoVersion: 17.0.0

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            ${{ env.CLIENT_DIR }}/package-lock.json
            ${{ env.E2E_DIR }}/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-17-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: nuget-17-${{ runner.os }}-

      - name: Build client
        working-directory: ${{ env.CLIENT_DIR }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # UmbracoVersion (above) is read by MSBuild as a property: everything below builds against Umbraco 17.
      - name: Build and test the package for Umbraco 17
        run: |
          dotnet build src/UmbracoVisualEditor/UmbracoVisualEditor.csproj -c Release -p:SkipClientBuild=true
          dotnet test --project tests/UmbracoVisualEditor.Tests/UmbracoVisualEditor.Tests.csproj -c Release -p:SkipClientBuild=true

      - name: Create HTTPS dev certificate
        run: dotnet dev-certs https

      - name: Install E2E dependencies
        working-directory: ${{ env.E2E_DIR }}
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: E2E tests (Compat Site on Umbraco 17)
        working-directory: ${{ env.E2E_DIR }}
        env:
          SkipClientBuild: 'true'
        run: npm run test:compat

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report-umbraco-17
          path: |
            ${{ env.E2E_DIR }}/playwright-report
            ${{ env.E2E_DIR }}/test-results
          if-no-files-found: ignore
